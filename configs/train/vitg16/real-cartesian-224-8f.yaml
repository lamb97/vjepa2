app: vjepa_droid
cpus_per_task: 12
folder: /projects/standard/kdesingh/shared/liu03222/real_cartesian_224/4.20.vitg16-224px-8f
mem_per_gpu: 220G
nodes: 1
tasks_per_node: 4
data:
  batch_size: 8
  camera_views:
  - left_mp4_path
